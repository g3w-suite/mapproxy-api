# #####################################################################
#                 MapProxy configuration
# #####################################################################
#

services:
  demo:
  wms:
    versions: ['1.1.1', '1.3.0']
    srs: {{ supported_srs }}
    bbox_srs: ['EPSG:4326']
    image_formats: ['image/jpeg', 'image/png', 'image/gif', 'image/GeoTIFF']
    on_source_errors: raise
    strict: true
    featureinfo_types: ['text', 'html', 'xml', 'json']
    md:
      title: '{{ title }}'
      abstract: '{{ abstract }}'
  tms:
    use_grid_names: true
  wmts:
    restful: true
    restful_template: '/{Layer}/{TileMatrixSet}/{TileMatrix}/{TileCol}/{TileRow}.{Format}'
    kvp: true
  kml:
    use_grid_names: true

globals:
  cache:
    meta_size: [6, 6]
    meta_buffer: 20
    lock_dir: './locks_{{ layer_name }}'
    tile_lock_dir: './tile_locks_{{ layer_name }}'
    link_single_color_images: true
  http:
    ssl_no_cert_checks: true

{% if has_localgrid -%}
grids:
  localgrid_tms:
    srs: '{{ srs }}'
    bbox: [{{ bbox_4326 }}]
    bbox_srs: 'EPSG:4326'
    origin: 'sw'

  localgrid_wmts:
    srs: '{{ srs }}'
    bbox: [{{ bbox_4326 }}]
    bbox_srs: 'EPSG:4326'
    origin: 'nw'
{%- endif %}

layers:
  - name: {{ layer_name }}
    title: {{ title }}
    sources: [{{ layer_name }}_cache]

caches:
  {{ layer_name }}_cache:
    sources: [{{ layer_name }}_wms]
    grids: [{% if has_localgrid %}{% if tms %}localgrid_tms{% else %}localgrid_wmts{% endif %}, {% endif %}GLOBAL_MERCATOR, GLOBAL_WEBMERCATOR, GLOBAL_GEODETIC]
    concurrent_tile_creators: 2
    cache:
      type: file

sources:
  {{ layer_name }}_wms:
    type: wms
    wms_opts:
      version: {{ wms_version }}
      featureinfo: True
    req:
      url: {{ ows_url }}
      layers: {{ wms_layers }}
      transparent: true
    supported_formats: {{ formats }}
    coverage:
      bbox: [{{ bbox_4326 }}]
      srs: 'EPSG:4326'
