services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        format: raw
    environment:
      MAPPROXY_CONF_DIR: /data/mapproxy/conf
      MAPPROXY_CACHE_DIR: /data/mapproxy/conf/cache_data
      MAPPROXY_PUBLIC_URL: http://localhost:8080
    volumes:
      - ${MAPPROXY_DATA_DIR}:/data/mapproxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mapproxy:
    image: python:3.12-slim
    ports:
      - "8080:8080"
    volumes:
      - ${MAPPROXY_DATA_DIR}:/data/mapproxy
    working_dir: /data/mapproxy/conf
    command:
      - sh
      - -c
      - >
        pip install --no-cache-dir --quiet MapProxy PyYAML pyproj Pillow &&
        mapproxy-util serve-multiapp-develop --bind=0.0.0.0:8080 /data/mapproxy/conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
