services:
  api:
    build: .
    env_file:
      - path: .env.secrets
        format: raw
    environment:
      MAPPROXY_CONF_DIR: /data/mapproxy/conf
      MAPPROXY_CACHE_DIR: /data/mapproxy/conf/cache_data
      MAPPROXY_PUBLIC_URL: http://localhost/mapproxy
    volumes:
      - ${MAPPROXY_DATA_DIR}:/data/mapproxy
    expose:
      - "8000"
    restart: unless-stopped

  mapproxy:
    image: python:3.12-slim
    volumes:
      - ${MAPPROXY_DATA_DIR}:/data/mapproxy
    working_dir: /data/mapproxy/conf
    command:
      - sh
      - -c
      - >
        pip install --no-cache-dir --quiet MapProxy gunicorn PyYAML pyproj Pillow &&
        printf '%s\n' 'from mapproxy.multiapp import make_wsgi_app' 'application = make_wsgi_app("/data/mapproxy/conf")' > /tmp/wsgi.py &&
        gunicorn --chdir /tmp wsgi:application -w 2 -b 0.0.0.0:8080 --access-logfile -
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - mapproxy
    restart: unless-stopped
